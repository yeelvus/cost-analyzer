<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>人工费汇总分析</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg1: #f3f7f2;
            --bg2: #f9efe4;
            --card: rgba(255,255,255,0.9);
            --line: #dde6dc;
            --txt: #21322a;
            --muted: #5e7167;
            --accent: #2f7d61;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: var(--txt);
            font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
            background: radial-gradient(circle at 20% 0%, #e8f2e3 0%, transparent 40%), radial-gradient(circle at 80% 0%, #f8e6d6 0%, transparent 35%), linear-gradient(160deg, var(--bg1), var(--bg2));
            min-height: 100vh;
            scroll-behavior: smooth;
        }
        .container { width: min(1400px, 97vw); margin: 28px auto 48px; }
        .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: start; }
        .toc { position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 20px rgba(36, 48, 41, 0.06); padding: 12px; }
        .toc-title { margin: 0 0 8px; font-size: 14px; color: #2f4338; font-weight: 700; }
        .toc-links { display: grid; gap: 6px; }
        .toc-link { display: block; padding: 6px 8px; border-radius: 8px; color: #2a473c; text-decoration: none; font-size: 12px; line-height: 1.35; background: rgba(227, 237, 230, 0.4); }
        .toc-link:hover { background: rgba(196, 106, 47, 0.18); }
        .hero, .project-card { background: var(--card); border: 1px solid var(--line); box-shadow: 0 10px 20px rgba(36, 48, 41, 0.06); }
        .hero { border-radius: 18px; padding: 18px 22px; margin-bottom: 16px; }
        h1 { margin: 4px 0 8px; font-size: clamp(22px, 3vw, 32px); }
        .hint { color: var(--muted); margin: 0; }
        .project-card { border-radius: 16px; padding: 18px; margin: 14px 0; }
        .card-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
        .card-header h2 { margin: 4px 0; flex: 1; font-size: clamp(18px, 2.2vw, 24px); }
        .status-tag { padding: 4px 10px; font-size: 12px; border-radius: 999px; background: rgba(47, 125, 97, 0.12); color: #285846; white-space: nowrap; }
        h3 { margin: 0 0 8px; font-size: 14px; color: #2f4338; }
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 32px; }
        .chart-wrap { width: 100%; height: 320px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
        th, td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: center; vertical-align: middle; }
        th { color: #31453a; background: rgba(227, 237, 230, 0.55); }
        td.num { text-align: center; font-variant-numeric: tabular-nums; }
        td.metric-cell { font-size: 12px; }
        td.remark-cell { font-size: 12px; line-height: 1.45; }
        td.strong-cell { font-weight: 700; color: #244d3e; }
        th, td { white-space: nowrap; }
        .export-btn, .export-all-btn { padding: 6px 12px; font-size: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; white-space: nowrap; transition: background 0.2s; }
        .export-btn:hover, .export-all-btn:hover { background: #1f6348; }
        .export-btn:active, .export-all-btn:active { transform: scale(0.98); }
        @media (max-width: 768px) {
            .layout { grid-template-columns: 1fr; }
            .toc { position: static; max-height: none; }
            .toc-links { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .chart-grid { grid-template-columns: 1fr; margin-bottom: 24px; }
            .chart-wrap { height: 270px; }
            .project-card { overflow-x: auto; }
            table { min-width: 980px; font-size: 12px; }
            td.metric-cell, td.remark-cell { font-size: 11px; }
            th, td { padding: 6px 4px; }
        }
        @media print {
            body { background: white; }
            .hero, .project-card { box-shadow: none; border: 1px solid #ccc; margin: 0; page-break-inside: avoid; }
            .export-btn, .export-all-btn { display: none !important; }
            .project-card { break-inside: avoid; page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="layout">
            <aside class="toc">
                <h3 class="toc-title">项目目录</h3>
                <div class="toc-links">__TOC_HTML__</div>
            </aside>
            <main>
                <section class="hero">
                    <h1>人工费汇总分析</h1>
                    <p class="hint">按项目展示人工费月度趋势与构成明细（单位：万泰铢）</p>
                </section>
                __ALL_SECTIONS__
            </main>
        </div>
    </div>
    <script>
        const months = __MONTHS_JSON__;
        const allData = __CHART_DATA_JSON__;
        const amountFormatter = (v) => v == null ? '-' : Number(v).toLocaleString('zh-CN', {maximumFractionDigits: 2});
        const labelFormatter = (v) => v == null ? '' : Number(v).toLocaleString('zh-CN', {maximumFractionDigits: 0});
        const inlineDataLabelPlugin = {
            id: 'inlineDataLabelPlugin',
            afterDatasetsDraw(chart) {
                const ctx = chart.ctx;
                chart.data.datasets.forEach((dataset, datasetIndex) => {
                    const meta = chart.getDatasetMeta(datasetIndex);
                    if (meta.hidden) return;
                    meta.data.forEach((element, index) => {
                        const raw = dataset.data[index];
                        if (raw == null) return;
                        const text = labelFormatter(raw);
                        if (!text) return;
                        const pos = element.tooltipPosition();
                        ctx.save();
                        ctx.fillStyle = '#24352d';
                        ctx.font = '600 10px "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';
                        ctx.fillText(text, pos.x, pos.y - 6);
                        ctx.restore();
                    });
                });
            }
        };
        Chart.register(inlineDataLabelPlugin);
        const computeAmountBounds = (...seriesList) => {
            const values = seriesList.flat().filter(v => v != null);
            if (!values.length) return { min: 0, max: 1 };
            const minVal = Math.min(...values);
            const maxVal = Math.max(...values);
            if (minVal >= 0) return { min: 0, max: maxVal * 1.15 + 1 };
            const span = maxVal - minVal;
            const pad = Math.max(span * 0.12, 1);
            return { min: minVal - pad, max: maxVal + pad };
        };
        const toCumulative = (arr) => {
            let sum = 0;
            return (arr || []).map(v => { if (v != null) sum += Number(v); return sum; });
        };
        const makeDataset = (label, data, borderColor, backgroundColor, pointRadius = 3, borderWidth = 2) => ({ label, data, borderColor, backgroundColor, pointRadius, borderWidth, tension: 0.25, spanGaps: true });
        const makeOptions = (bounds, labels = false) => ({
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'top' },
                ...(labels ? { inlineDataLabelPlugin: {} } : {}),
                tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label || ''}: ${amountFormatter(ctx.raw)} 万泰铢` } }
            },
            scales: { y: { min: bounds.min, max: bounds.max, ticks: { callback: (v) => amountFormatter(v) } } }
        });
        Object.entries(allData).forEach(([chartKey, series]) => {
            const idx = chartKey.split('_')[1];
            const amountEl = document.getElementById(`chart_amount_${idx}`);
            const detailEl = document.getElementById(`chart_detail_${idx}`);
            if (!amountEl || !detailEl) return;
            const colors = [['#2c7fb8', 'rgba(44,127,184,0.12)'], ['#3fae72', 'rgba(63,174,114,0.12)'], ['#d08b2f', 'rgba(208,139,47,0.12)'], ['#8f5ccf', 'rgba(143,92,207,0.12)']];
            const names = ['中方正式工', '中方劳务工', '子公司属地工', '劳务公司'];
            const keys = ['zh_formal', 'zh_labor', 'local_labor', 'outsourcing_labor'];
            const cumulative = keys.map(key => toCumulative(series[key]));
            const amountDatasets = cumulative.map((data, i) => makeDataset(`${names[i]}累计`, data, colors[i][0], colors[i][1]));
            amountDatasets.push(makeDataset('总人工费累计', toCumulative(series.total_labor), '#245f4b', 'rgba(36,95,75,0.15)', 4, 2.5));
            new Chart(amountEl, { type: 'line', data: { labels: months, datasets: amountDatasets }, options: makeOptions(computeAmountBounds(...amountDatasets.map(item => item.data)), true) });
            const detailDatasets = keys.map((key, i) => makeDataset(`${names[i]}铢`, series[key], colors[i][0], colors[i][1]));
            new Chart(detailEl, { type: 'line', data: { labels: months, datasets: detailDatasets }, options: makeOptions(computeAmountBounds(...keys.map(key => series[key]))) });
        });
        function exportCardPDF(cardId) {
            const element = document.getElementById(cardId);
            if (!element) return;
            const allCards = document.querySelectorAll('.project-card');
            allCards.forEach(card => { card.style.display = card.id === cardId ? 'block' : 'none'; });
            const heroSection = document.querySelector('.hero');
            const exportAllBtn = document.querySelector('.export-all-btn').parentElement;
            heroSection.style.display = 'none';
            exportAllBtn.style.display = 'none';
            setTimeout(() => {
                window.print();
                allCards.forEach(card => { card.style.display = 'block'; });
                heroSection.style.display = 'block';
                exportAllBtn.style.display = 'block';
            }, 100);
        }
        function exportAllCardsPDF() {
            const exportAllBtn = document.querySelector('.export-all-btn').parentElement;
            exportAllBtn.style.display = 'none';
            setTimeout(() => { window.print(); exportAllBtn.style.display = 'block'; }, 100);
        }
    </script>
</body>
</html>
